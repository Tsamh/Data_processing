name: Publier les notebooks sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer nbconvert
        run: python -m pip install --upgrade pip nbconvert

      - name: Convertir le notebook en page HTML autonome
        run: |
          mkdir -p _site
          python -m nbconvert --to html --embed-images \
            --output index --output-dir _site \
            titanic_passenger_survival/titanic_data_survival_analysis.ipynb

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
